version: 1

# Rollup hierarchies. Category members mirror DIM_CATEGORY; individual SKUs
# attach at runtime via the in_product_line / in_category edges (not enumerated).

hierarchies:
  - id: ProductCategory
    name: Product Category Hierarchy
    description: Category -> ProductLine taxonomy. Drives portfolio rollups (compliance, COGS, wastage).
    owner: portfolio_team
    levels:
      - { id: category,     label: Category,     order: 1 }
      - { id: product_line, label: "Product Line", order: 2 }
    members:
      # `attributes.owner` on desserts/snacks is a scoped-authority tag (not a
      # new fact — the whole-hierarchy `owner: portfolio_team` above already
      # names portfolio_team accountable for this taxonomy; this just points
      # that authority at portfolio_team's placeholder Lead role for two
      # categories, so the Organization page's scoped-responsibilities /
      # governed-scopes panels have something real to render). Remove once
      # per-category ownership is actually decided.
      - { id: desserts,      label: "Desserts",      level: category, attributes: { owner: portfolio_team_lead, assignment_label: "Category owner (placeholder)" } }
      - { id: health_bars,   label: "Health Bars",   level: category }
      - { id: snacks,        label: "Snacks",        level: category, attributes: { owner: portfolio_team_lead, assignment_label: "Category owner (placeholder)" } }
      - { id: mithai,        label: "Mithai",        level: category }
      - { id: savories,      label: "Savories",      level: category }
      - { id: dessert_bites, label: "Dessert Bites", level: category }

  - id: Geo
    name: Store Geographic Hierarchy
    description: Region -> City rollup for store, wastage & review KPIs.
    owner: supply_chain_team
    levels:
      - { id: region, label: Region, order: 1 }
      - { id: city,   label: City,   order: 2 }
    members:
      # See the ProductCategory note above — mumbai/pune's `attributes.owner`
      # is a placeholder scoped-authority tag pointed at supply_chain_team's
      # Lead role, not a new fact beyond the hierarchy-level owner already set.
      - { id: india,   label: "India",   level: region }
      - { id: mumbai,  label: "Mumbai",  level: city, parent: india, attributes: { owner: supply_chain_team_lead, assignment_label: "City owner (placeholder)" } }
      - { id: pune,    label: "Pune",    level: city, parent: india, attributes: { owner: supply_chain_team_lead, assignment_label: "City owner (placeholder)" } }
      - { id: delhi,   label: "Delhi",   level: city, parent: india }
      - { id: bengaluru, label: "Bengaluru", level: city, parent: india }

  - id: ChannelGroup
    name: Channel Grouping
    description: Online vs Offline grouping — reconciles the PIM channel list with live channel strings.
    owner: sales_team
    levels:
      - { id: mode,    label: Mode,    order: 1 }
      - { id: channel, label: Channel, order: 2 }
    members:
      # See the ProductCategory note above — online/offline's `attributes.owner`
      # is a placeholder scoped-authority tag pointed at sales_team's Lead
      # role, not a new fact beyond the hierarchy-level owner already set.
      - { id: online,  label: "Online",  level: mode, attributes: { owner: sales_team_lead, assignment_label: "Channel mode owner (placeholder)" } }
      - { id: offline, label: "Offline", level: mode, attributes: { owner: sales_team_lead, assignment_label: "Channel mode owner (placeholder)" } }
      - { id: swiggy,    label: "Swiggy",    level: channel, parent: online }
      - { id: zomato,    label: "Zomato",    level: channel, parent: online }
      - { id: blinkit,   label: "Blinkit",   level: channel, parent: online }
      - { id: zepto,     label: "Zepto",     level: channel, parent: online }
      - { id: instamart, label: "Instamart", level: channel, parent: online }
      - { id: d2c,       label: "D2C",       level: channel, parent: online }
      - { id: horeca,    label: "HoReCa",    level: channel, parent: offline }
      - { id: qsr,       label: "QSR",       level: channel, parent: offline }
      - { id: gifting,   label: "Gifting",   level: channel, parent: offline }
