# Access policies, projected as meta.Policy nodes linked to the entity types they
# apply to. A policy that declares an `action_type` is additionally compiled into an
# enforced rule after apply — see context-graph/docs/POLICY_ENFORCEMENT.md.
#
# `cedar` given  -> stored verbatim, no model consulted.
# `cedar` absent -> generated from `description` on the first apply, and regenerated
#                   only when the description or action_type changes.

policies:

  # ---- Enforced: hand-written Cedar --------------------------------------

  - name: dataset_writes_stay_in_master_data
    description: >-
      Process actions may only write to the ctx_upside_master_data dataset. Every idea
      and reformulation upsert in this graph targets it; a write anywhere else is a
      misconfigured process, not a business decision.
    applies_to: Product
    action_type: action:dataset_upsert
    cedar: |
      @id("dataset_writes_stay_in_master_data")
      forbid(principal, action, resource)
      when { context.input has dataset && context.input.dataset != "ctx_upside_master_data" };

  - name: no_payment_pii_in_outbound_mail
    description: >-
      Never send a card number or PAN out by email. Shelf-life and campaign reports
      quote costs and volumes, never payment identifiers.
    applies_to: Company
    action_type: system:email
    cedar: |
      @id("no_payment_pii_in_outbound_mail")
      forbid(principal, action, resource)
      when { context.input has pii_kinds && context.input.pii_kinds.containsAny(["card", "pan"]) };

  # ---- Enforced: generated from the English on apply ---------------------

  - name: no_mass_mail_from_processes
    description: >-
      A process may not email more than five recipients at once. Operational reports go
      to a named desk owner; anything wider is a broadcast and needs a person to send it.
    applies_to: Company
    action_type: action:email

  - name: bulk_dataset_writes_need_review
    description: >-
      Refuse a dataset write that touches more than 50 rows in one action. Idea and
      reformulation upserts are row-at-a-time, so a bulk write is a runaway loop.
    applies_to: Product
    action_type: action:dataset_upsert

  # ---- Declared but dormant: flip `enforce` to true to turn it on --------

  - name: competitor_intel_stays_internal
    description: >-
      Competitor pricing and listing intelligence must not leave the company by email.
      Dormant until the competitive-pricing reports settle on their recipients.
    applies_to: Competitor
    action_type: system:email
    enforce: false

  # ---- Documentation only: no action_type, exactly as before -------------

  - name: product_cost_visibility
    description: Landed cost and margin fields on products are visible to finance and NPD only.
    applies_to: Product
    allow:
      - role: finance
        actions: [read, write]
      - role: npd
        actions: [read]
    deny:
      - role: "*"
        actions: [read]
        fields: [total_cogs_inr, base_price_inr]

  - name: supplier_coa_confidentiality
    description: Supplier certificates of analysis are procurement- and quality-only.
    applies_to: Supplier
    allow:
      - role: procurement
        actions: [read, write]
      - role: quality
        actions: [read]
    deny:
      - role: "*"
        actions: [read]
